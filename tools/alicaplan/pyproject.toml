[project]
name = "alicaplan"
version = "0.1.0"
description = "Compile, check and decompile ALICA plans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
alicaplan = "alicaplan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
