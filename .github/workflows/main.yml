name: Build and Test
on:
  push:
    branches:
      - devel
      - ros2_lyrical
  pull_request:
    branches:
      - devel
      - ros2_lyrical
      - lyrical/**
  workflow_dispatch:
jobs:
  ROS1_build_test:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v2
      - name: Checkout
        uses: actions/checkout@v3
      - name: Pull ROS1 images
        run: docker pull ros:noetic
      - name: Build and test Alica on ROS Noetic
        uses: docker/build-push-action@v3
        with:
          context: .
          file: "./.github/workflows/ros1_build_test/Dockerfile"
          platforms: linux/amd64
          push: false
          tags: noetic
          build-args: |
            COMMIT=${{ github.sha }}
  ROS2_lyrical_build_test:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v2
      - name: Checkout
        uses: actions/checkout@v3
      - name: Pull ROS2 images
        run: docker pull ros:lyrical-ros-base
      - name: Build and test Alica on ROS2 Lyrical
        uses: docker/build-push-action@v3
        with:
          context: .
          file: "./.github/workflows/ros2_lyrical_build_test/Dockerfile"
          platforms: linux/amd64
          push: false
          tags: lyrical
          build-args: |
            COMMIT=${{ github.sha }}
