name: Build and Test
on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel
  workflow_dispatch:
jobs:
  cmake_build_test:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libgtest-dev libboost-system-dev libboost-filesystem-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja yaml-cpp googletest boost
      - name: Build and test
        run: scripts/build.sh
        env:
          TEST_JOBS: 1
          # The macOS runner cannot hold a 30 Hz timer, which this test measures.
          TEST_EXCLUDE: ${{ runner.os == 'macOS' && 'testRepeatedRunSchedulingTest' || '' }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Test alicaplan
        working-directory: tools/alicaplan
        run: uv run pytest
        env:
          ALICA_LOAD_PLANS_REQUIRED: "1"
  ROS2_build_test:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v2
      - name: Checkout
        uses: actions/checkout@v3
      - name: Pull ROS2 images
        run: docker pull ros:humble
      - name: Build and test Alica on ROS2 Humble
        uses: docker/build-push-action@v3
        with:
          context: .
          file: "./.github/workflows/ros2_build_test/Dockerfile"
          platforms: linux/amd64
          push: false
          tags: humble
          build-args: |
            COMMIT=${{ github.sha }}
